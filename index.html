<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Development Ongoing</title>
    <!-- Framework: Tailwind CSS for Responsiveness -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Fonts for a High-Tech look */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;600&display=swap');

        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            /* Deeper Purple Background */
            background-color: #0d0a1b;
        }

        /* Animated Gradient Background - Shifted to Deep Purple/Blue */
        .animated-gradient {
            background: linear-gradient(135deg, #2b1f40 0%, #080315 25%, #2b1f40 75%, #080315 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Enhanced Glass Effect */
        .glass-effect {
            /* Deeper background with more blur for better contrast */
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(25px);
            /* Fuchsia Border */
            border: 1px solid rgba(236, 72, 153, 0.2); 
        }

        /* Neon Glow Text (Using Fuchsia/Violet combo) */
        .neon-glow {
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.9), /* Fuchsia */
                         0 0 30px rgba(168, 85, 247, 0.7),  /* Violet */
                         0 0 50px rgba(168, 85, 247, 0.5);
        }

        /* Pulsating Card Shadow */
        .pulse-glow {
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 30px rgba(236, 72, 153, 0.3), /* Subtle Fuchsia */
                           0 0 60px rgba(168, 85, 247, 0.1);  /* Subtle Violet */
            }
            50% {
                box-shadow: 0 0 40px rgba(236, 72, 153, 0.5),
                           0 0 80px rgba(168, 85, 247, 0.2);
            }
        }

        /* Icon Float and Spin */
        .float-animation {
            animation: float 6s ease-in-out infinite, spin 8s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Progress Bar Animation */
        .progress-bar-fill {
            animation: progressLoad 4s ease-in-out infinite;
        }

        @keyframes progressLoad {
            0%, 100% { width: 25%; }
            50% { width: 85%; }
        }
        
        /* Particle Effects */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* Ensure Mobile Responsiveness for all elements */
        @media (max-width: 640px) {
            .neon-glow {
                font-size: 3rem; /* 48px */
            }
            .glass-effect {
                padding: 2rem;
            }
        }
    </style>
</head>
<body class="animated-gradient min-h-screen flex items-center justify-center p-4 relative">
    
    <!-- Floating Particles Background (z-0) -->
    <div id="particles-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Main Content Container (z-10) -->
    <div class="relative z-10 max-w-2xl w-full">
        
        <!-- Glass Card (Improved Aesthetics) -->
        <div class="glass-effect rounded-3xl p-6 sm:p-10 lg:p-12 pulse-glow transition duration-500">
            
            <!-- Animated Gear Icon (Represents work in progress) -->
            <div class="flex justify-center mb-10">
                <!-- Icon color changed to Fuchsia-400 -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 sm:w-28 sm:h-28 text-fuchsia-400 float-animation" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.49 1.49 0 0 0 1.05-1.49v-3.02a1.49 1.49 0 0 0-1.05-1.49L17.7 7.35l-.26-1.57a1.49 1.49 0 0 0-1.56-1.56l-1.57-.26L12 2v0l-1.57.26a1.49 1.49 0 0 0-1.56 1.56l-.26 1.57L4.6 9a1.49 1.49 0 0 0-1.05 1.49v3.02c0 .59.35 1.13.88 1.37l2.42 1.47 1.57.26a1.49 1.49 0 0 0 1.56-1.56l.26-1.57L12 17.5v0l1.57-.26a1.49 1.49 0 0 0 1.56 1.56l.26 1.57L19.4 15z"/>
                </svg>
            </div>

            <!-- Main Title with Neon Effect (Updated to simpler words) -->
            <h1 class="text-4xl sm:text-6xl font-black text-center mb-4 neon-glow text-white leading-tight" style="font-family: 'Orbitron', sans-serif;">
                MAINTENANCE<br/>IN PROGRESS
            </h1>

            <!-- Subtitle (Updated to simpler message) -->
            <p class="text-xl sm:text-2xl text-center mb-12 text-white/90 font-medium">
                We're preparing the game for a massive update.
            </p>

            <!-- Progress Bar Section -->
            <div class="max-w-lg mx-auto mb-12">
                <div class="flex justify-between text-sm mb-2 text-white/70 font-mono">
                    <span>Loading Core Modules...</span>
                    <span>[ETA: 48:00]</span>
                </div>
                <div class="h-4 bg-white/10 rounded-full overflow-hidden backdrop-blur-sm shadow-inner shadow-black/20">
                    <!-- Gradient changed to Fuchsia/Violet -->
                    <div class="h-full bg-gradient-to-r from-fuchsia-500 to-violet-500 progress-bar-fill rounded-full shadow-lg shadow-fuchsia-500/30"></div>
                </div>
                <p class="text-center mt-3 text-white/70 text-sm">Deployment Phase: In Progress</p>
            </div>

            <!-- Footer Text (User's preferred line) -->
            <div class="text-center mt-10">
                <p class="text-2xl sm:text-3xl font-extrabold text-white/90 tracking-wider scale-pulse">
                    We'll be back online with an awesome update.
                </p>
                <p class="mt-4 text-white/50 text-xs uppercase tracking-widest">
                    Thank you for your patience, Gamer.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Create floating particles for the background
        const particlesContainer = document.getElementById('particles-container');
        // Particle colors updated to match the new Fuchsia/Violet theme
        const colors = ['#ec4899', '#a855f7', '#ffffff', '#000000']; 
        
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 5 + 1; // Size 1px to 6px
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            // Randomize animation duration and delay for a scattered look
            particle.style.animation = `particleFloat ${Math.random() * 15 + 15}s linear infinite`;
            particle.style.animationDelay = Math.random() * 10 + 's';
            
            particlesContainer.appendChild(particle);
            
            // Remove particle after its animation cycle to prevent memory overload
            setTimeout(() => {
                particle.remove();
            }, 30000);
        }

        // Generate particles continuously (one every 200ms)
        setInterval(createParticle, 200);
        
        // Initial burst for immediate effect
        for (let i = 0; i < 50; i++) {
            setTimeout(createParticle, i * 50);
        }
    </script>
</body>
</html>
