<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Under Construction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            text-align: center;
            flex-direction: column;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 90%; /* Responsive width */
            box-sizing: border-box; /* Include padding in width */
        }

        h1 {
            color: #333;
            font-size: 2.5em; /* Responsive font size */
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 1.2em; /* Responsive font size */
        }

        .signature {
            margin-top: 30px;
            font-style: italic;
            color: #888;
        }

        /* Media queries for even better responsiveness */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            p {
                font-size: 1em;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Game is Under Construction!</h1>
        <p>We're working hard to bring you an amazing gaming experience.</p>
        <p>Please check back soon!</p>
        <p class="signature">Message by Daniyal</p>
    </div>
</body>
</html>
